name: CI
on:
  merge_group: {}
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  actions: read
  code-quality: write
  contents: read
  packages: read

jobs:
  validate:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 26
          - 24
          - 22
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: ⚙️ Setup
        uses: w5s/actions/setup@e3fa45a4cbbf9e7abe3f39158ce73c291b55ae2c # main
        with:
          node-version: ${{ matrix.node-version }}
      - name: 🔨 Build
        uses: w5s/actions/task@e3fa45a4cbbf9e7abe3f39158ce73c291b55ae2c # main
        with:
          task: build
      - name: 🔍 Validate
        uses: w5s/actions/task@e3fa45a4cbbf9e7abe3f39158ce73c291b55ae2c # main
        with:
          task: validate
